<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adobe Stock Metadata Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-launcher">

    <!-- Header -->
    <header class="launcher-header">
      <div class="brand-row">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Adobe Stock Pro</div>
          <div class="brand-plan-badge" id="popup-plan-badge">FREE PLAN</div>
        </div>
      </div>
      <div class="status-indicator-badge" id="popup-status-badge">Ready</div>
    </header>

    <!-- Quota & Quick Info -->
    <div class="launcher-card">
      <div class="usage-row">
        <span class="usage-label">Today's Generations:</span>
        <span class="usage-value" id="popup-usage-text">0 / 20</span>
      </div>
      <div class="usage-bar">
        <div class="usage-fill" id="popup-usage-fill" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="actions-group">
      <button class="btn-action primary" id="popup-btn-process-selected">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Process Selected Image</span>
      </button>

      <button class="btn-action secondary" id="popup-btn-workspace">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        <span>Open Full Workspace</span>
      </button>
    </div>

    <!-- Quick Action / Status Toast -->
    <div id="popup-toast" class="popup-toast" style="display: none;"></div>

    <!-- Active Pro License Status Card (Shown when Pro is active) -->
    <div class="active-license-card" id="popup-pro-card" style="display: none;">
      <div class="pro-card-header">
        <div class="pro-card-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="popup-pro-plan-name">Pro License Active</span>
        </div>
        <span class="pro-status-pill">VERIFIED</span>
      </div>
      <div class="pro-card-details">
        <span id="popup-pro-device-count">1 of 2 Devices</span>
        <span>•</span>
        <span id="popup-pro-expiry">No Expiry</span>
      </div>
    </div>

    <!-- Quick License Input (Shown only when on Free plan) -->
    <div class="quick-license-section" id="popup-license-form">
      <div class="section-title">Upgrade to Pro with License Key</div>
      <div class="license-input-row">
        <input type="text" id="popup-license-input" placeholder="ASMP-PRO-XXXX...">
        <button id="popup-btn-activate">Activate</button>
      </div>
    </div>

    <!-- Footer Links -->
    <footer class="launcher-footer">
      <a href="../docs/privacy-policy.html" target="_blank">Privacy</a>
      <span>•</span>
      <a href="../docs/terms.html" target="_blank">Terms</a>
      <span>•</span>
      <a href="../docs/refund-policy.html" target="_blank">Refund Policy</a>
    </footer>

  </div>

  <script src="../src/config/product.config.js"></script>
  <script src="../src/lib/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
